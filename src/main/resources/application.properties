spring.application.name=springweb

# 설정 : .properties 파일의 역할 설명
# application.properties 역할 : spring 관련 설정 값을 정의하는 곳
# 1. 서버 관련 설정 , 포트 지정 , 기본값 8080
server.port=8080

# 2. 데이터베이스 연결 설정
# 2-1 연결할 DB 주소
#spring.datasource.url=jdbc:mysql://localhost:3306/mydb0902
#spring.datasource.url=jdbc:mysql://localhost:3306/practice4
spring.datasource.url=jdbc:mysql://localhost:3306/mydb1002

# 2-2 DB접속 아이디/비밀번호
spring.datasource.username=root
spring.datasource.password=1234
# 3. DDL
# create : 서버 실행될때 엔티티 기반으로 테이블 삭제후 생성
# create-drop : 서버 실행될때 엔티티 기반으로 테이블 생성 , 서버 종료시 삭제
# update : 서버 실행될 때 존재하면 엔티티 수정 없으면 생성
spring.jpa.hibernate.ddl-auto=create-drop
# 4. SQL 콘솔 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 5. 서버 실행될 때 (DML) data.sql 파일 (경로) 파일 실행 , classpath : 리소스폴더
#spring.sql.init.data-locations=classpath:/sql/0904.sql
#spring.sql.init.data-locations=classpath:/sql/practice4.sql
#spring.sql.init.data-locations=classpath:/sql/practice5.sql
spring.sql.init.data-locations=classpath:/sql/1002.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=utf-8

# 6. 외부 api 서비스키
# 6-1: 공공데이터 key
api.public-data.serviceKey=133a87bf0560d1f71d28b921f55209465a418318bfbc48a90409ef98072c41ab

# 7. JWT 비밀키
# 마음대로 32글자 임의 데이터
jwt.secret=12345678123456781234567812345678

# 8. Redis 연동
spring.data.redis.host=localhost
spring.data.redis.port=6379


